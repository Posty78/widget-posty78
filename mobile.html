<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; }
  body { background: transparent; overflow: hidden; }
</style>
</head>
<body>
<audio id="tts-audio"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqTfmdrbyfZv6cn22BH9JI67rxSRrn1iI",
  authDomain: "posty78-widget.firebaseapp.com",
  projectId: "posty78-widget",
  appId: "1:735535963299:web:0b6e6277fee374529cb316"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let lastCmdTs = 0;

onSnapshot(doc(db, "config", "commandes"), (snap) => {
  if (!snap.exists()) return;
  const cmd = snap.data();
  if (!cmd.ts || cmd.ts <= lastCmdTs) return;
  lastCmdTs = cmd.ts;

  if (cmd.type === "alerte") {
    const name = cmd.name || "Anonyme";
    const amount = parseFloat(cmd.amount || 0);
    const alerteDuration = cmd.alerteDuration || 15000;

    setTimeout(() => {
      const msg = encodeURIComponent(name + " vient de faire un don de " + amount.toFixed(0) + " euros pour les Restaurants du Coeur !");
      const url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=fr&client=tw-ob&q=" + msg;
      const audio = document.getElementById("tts-audio");
      audio.src = url;
      audio.play().catch(e => console.log(e));
    }, alerteDuration + 500);
  }
});
</script>
</body>
</html>
