<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; font-family: 'Open Sans', sans-serif; }
  #widget { position: fixed; top: 0; left: 0; width: 600px; height: 40px; background: transparent; border-radius: 4px; overflow: hidden; }
  #bar-fill { position: absolute; top: 0; left: 0; height: 100%; background: #00cc44; width: 0%; transition: width 1.5s ease; border-radius: 4px; }
  #content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
  #raised, #goal { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; flex-shrink: 0; text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000; }
  #title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; flex: 1; text-align: center; text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000; }
  #alert { position: fixed; top: 50px; left: 0; width: 600px; display: none; flex-direction: column; align-items: center; gap: 8px; background: transparent; }
  #alert.show { display: flex; }
  #alert-box { background: transparent; text-align: center; padding: 8px 20px; }
  #alert-name { font-size: 28px; font-weight: 700; color: #00cc44; text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000; }
  #alert-amount { font-size: 22px; font-weight: 700; color: #fff; text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000; margin-top: 4px; }
  #alert-comment { font-size: 18px; font-weight: 700; color: #ffdd00; font-style: italic; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; margin-top: 6px; display: none; }
  #alert-gif { width: 280px; height: 200px; object-fit: cover; border-radius: 10px; }
</style>
</head>
<body>
<div id="widget">
  <div id="bar-fill"></div>
  <div id="content">
    <span id="raised">€0.00</span>
    <span id="title">Pour les Restaurants du Cœur</span>
    <span id="goal">€1,000.00</span>
  </div>
</div>
<div id="alert">
  <div id="alert-box">
    <div id="alert-name"></div>
    <div id="alert-amount"></div>
    <div id="alert-comment"></div>
  </div>
  <img id="alert-gif" src="" alt="" style="display:none">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqTfmdrbyfZv6cn22BH9JI67rxSRrn1iI",
  authDomain: "posty78-widget.firebaseapp.com",
  projectId: "posty78-widget",
  appId: "1:735535963299:web:0b6e6277fee374529cb316"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CAMPAIGN_ID = "ac3a7c31-144b-4a84-be7d-5f709f637211";
let lastDonationId = null;
let alertActive = false;
let alertes = [];
const LOAD_TIME = Date.now();

onSnapshot(doc(db, "config", "alertes"), (snap) => {
  if (snap.exists()) alertes = snap.data().liste || [];
});

onSnapshot(doc(db, "config", "commandes"), (snap) => {
  if (!snap.exists()) return;
  const cmd = snap.data();
  // Ignorer les commandes de plus de 5 secondes
  if (!cmd.ts || (Date.now() - cmd.ts) > 5000) return;
  // Ignorer si chargé avant la commande
  if (cmd.ts < LOAD_TIME) return;

  if (cmd.type === "barre") {
    document.getElementById("bar-fill").style.width = (cmd.pct || 0) + "%";
  }
  if (cmd.type === "alerte") {
    const alerte = alertes.find(a => a.id == cmd.alerteId) || alertes[0];
    if (alerte) lancerAlerte(cmd.name || "Anonyme", cmd.amount || 5, cmd.comment || "", alerte);
  }
});

function getAlerte(amount) {
  const sorted = [...alertes].sort((a, b) => b.minAmount - a.minAmount);
  return sorted.find(a => amount >= a.minAmount) || null;
}

function lancerAlerte(name, amount, comment, alerte) {
  if (alertActive) return;
  alertActive = true;

  document.getElementById("alert-name").textContent = name;
  document.getElementById("alert-amount").textContent = "€" + parseFloat(amount).toFixed(2);

  const commentEl = document.getElementById("alert-comment");
  if (comment) { commentEl.textContent = '"' + comment + '"'; commentEl.style.display = "block"; }
  else { commentEl.style.display = "none"; }

  const gif = document.getElementById("alert-gif");
  if (alerte?.gifUrl) { gif.src = alerte.gifUrl + "?" + Date.now(); gif.style.display = "block"; }
  else { gif.style.display = "none"; }

  const duration = alerte?.duration || 15000;

  // Son via audio classique
  const audio = new Audio();
  if (alerte?.soundUrl) {
    audio.src = alerte.soundUrl;
    audio.volume = alerte.volume || 1;
    audio.play().catch(e => console.log("Audio error:", e));
  }

  document.getElementById("alert").classList.add("show");

  setTimeout(() => {
    document.getElementById("alert").classList.remove("show");
    gif.style.display = "none";

    // TTS après l'alerte
    setTimeout(() => {
      const msg = name + " vient de faire un don de " + parseFloat(amount).toFixed(0) + " euros pour les Restaurants du Cœur !";
      const tts = new SpeechSynthesisUtterance(msg);
      tts.lang = "fr-FR";
      tts.rate = 1;
      tts.onend = () => { alertActive = false; };
      tts.onerror = () => { alertActive = false; };

      const trySpeak = () => {
        const voices = speechSynthesis.getVoices();
        const voixF = voices.find(v => v.lang.startsWith("fr") && v.name.toLowerCase().includes("female"))
                   || voices.find(v => v.lang.startsWith("fr"))
                   || voices[0];
        if (voixF) tts.voice = voixF;
        speechSynthesis.cancel();
        speechSynthesis.speak(tts);
      };

      if (speechSynthesis.getVoices().length > 0) {
        trySpeak();
      } else {
        speechSynthesis.addEventListener("voiceschanged", trySpeak, { once: true });
        // Fallback si voiceschanged ne se déclenche pas
        setTimeout(trySpeak, 1000);
      }
    }, 500);

  }, duration);
}

async function fetchData() {
  try {
    const res = await fetch("https://v5api.tiltify.com/api/public/campaigns/" + CAMPAIGN_ID);
    const data = await res.json();
    const raised = parseFloat(data.data?.amount_raised?.value || 0);
    const goal = parseFloat(data.data?.goal?.value || 1000);
    const pct = Math.min((raised / goal) * 100, 100);
    document.getElementById("raised").textContent = "€" + raised.toFixed(2);
    document.getElementById("goal").textContent = "€" + goal.toFixed(2);
    document.getElementById("bar-fill").style.width = pct + "%";
  } catch(e) {}
}

async function checkDonations() {
  try {
    const res = await fetch("https://v5api.tiltify.com/api/public/campaigns/" + CAMPAIGN_ID + "/donations?limit=1");
    const data = await res.json();
    const donations = data.data;
    if (!donations || donations.length === 0) return;
    const latest = donations[0];
    if (lastDonationId === null) { lastDonationId = latest.id; return; }
    if (latest.id !== lastDonationId) {
      lastDonationId = latest.id;
      const amount = parseFloat(latest.amount.value);
      const alerte = getAlerte(amount);
      if (alerte) lancerAlerte(latest.donor_name || "Anonyme", amount, latest.donor_comment || "", alerte);
    }
  } catch(e) {}
}

fetchData();
setInterval(fetchData, 30000);
setInterval(checkDonations, 12000);
</script>
</body>
</html>
